[project]
name = "inventory"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlmodel>=0.0.16",
    "pydantic-settings>=2.2.1",
    "aiosqlite>=0.20.0",
    "pyjwt>=2.8.0",
    "bcrypt>=4.1.2",
    "websockets>=12.0",
    "httpx>=0.27.0",
    "pyotp>=2.9.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.14",
]

[tool.ruff]
line-length = 120
include = ["*.py", "**/*.py"]
# exclude = ["web/**", "public/**", "node_modules/**", "dist/**"]
extend-select = ["I"]
